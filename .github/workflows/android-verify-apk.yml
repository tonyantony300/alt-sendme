name: 'android-verify-apk'

# One-off APK for Google's developer-verification (ADI) flow. It exists only to
# prove ownership of the signing key, so it is never published: the token file
# is injected at build time rather than committed, keeping it out of the app
# that ships to users.
on:
  workflow_dispatch:
    inputs:
      adi_token:
        description: 'Registration snippet from the Play Console verification page'
        required: true
        type: string

jobs:
  verify-apk:
    name: Developer verification APK
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.12.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: build-tools;36.0.0 platform-tools platforms;android-36

      - name: Set up NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: setup-ndk
        with:
          ndk-version: r28b
          local-cache: true

      - name: NDK and SDK env
        shell: bash
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      - name: Set Rust 1.91 and Android targets
        uses: dtolnay/rust-toolchain@3056ad9b1fc916cb9a55f7f72ae4a848b7d50249 # 1.91.0
        with:
          components: rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install WASM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          key: ubuntu-22.04-android-cargo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # arm64 only: this APK is never distributed, so one ABI is enough and it
      # halves the build time.
      - name: Build verification APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_ADI_TOKEN: ${{ inputs.adi_token }}
          ANDROID_APK_PROFILES: arm64
          ANDROID_AAB_PROFILES: ''
        run: pnpm run android:build:release

      # The exact failure this workflow exists to prevent: an APK that builds
      # and signs correctly but is missing the token file.
      - name: Verify token file and signature
        shell: bash
        env:
          ADI_TOKEN: ${{ inputs.adi_token }}
          EXPECTED_SHA256: 'B4:5E:62:74:E9:6B:4A:72:73:AD:93:51:2D:D5:1C:0D:C6:DA:A5:CA:19:14:9D:C6:01:B9:0F:88:93:8F:09:59'
        run: |
          set -euo pipefail
          APK=build/android-apks/app-arm64-release.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: expected signed APK at $APK"
            ls -la build/android-apks 2>&1 || true
            exit 1
          fi

          EMBEDDED=$(unzip -p "$APK" assets/adi-registration.properties | tr -d '[:space:]')
          EXPECTED=$(printf '%s' "$ADI_TOKEN" | tr -d '[:space:]')
          if [ "$EMBEDDED" != "$EXPECTED" ]; then
            echo "ERROR: token file missing or does not match the supplied snippet."
            echo "  embedded: '${EMBEDDED}'"
            exit 1
          fi
          echo "token file present and matches"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -r | head -1)/apksigner
          # Match the 64-hex digest itself rather than a field position: the
          # label's surrounding punctuation varies between build-tools versions.
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' \
            | grep -oiE '[0-9a-f]{64}' \
            | head -1 \
            | tr '[:lower:]' '[:upper:]' \
            | sed 's/../&:/g; s/:$//' || true)
          if [ -z "$ACTUAL" ]; then
            echo "ERROR: could not read a signing certificate from the APK."
            "$APKSIGNER" verify --print-certs "$APK" || true
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signed by an unexpected key."
            echo "  expected: $EXPECTED_SHA256"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          {
            echo "### Developer verification APK"
            echo ""
            echo "- token file: \`assets/adi-registration.properties\` present"
            echo "- signer SHA-256: \`${ACTUAL}\`"
            echo "- upload this APK to the Play Console verification page"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DashBeam-developer-verification-apk
          path: build/android-apks/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 7
