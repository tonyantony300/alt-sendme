name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
      - release

jobs:
  rust-e2e:
    name: Rust E2E Transfer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './engine -> target'
      # The root manifest only covers the `engine` package.
      - name: Run protocol and native unit tests
        run: cargo test --manifest-path engine/Cargo.toml -p sendme-protocol -p sendme-native
        timeout-minutes: 10
      - name: Run engine E2E tests
        run: cargo test --manifest-path engine/Cargo.toml -- --test-threads=1
        timeout-minutes: 10

  ios-build:
    name: iOS Build Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Pin encodes toolchain 1.91.0, matching rust-toolchain.toml.
      # iOS targets live here rather than in rust-toolchain.toml so Linux and
      # F-Droid builds don't pull an Apple std they can never use.
      - uses: dtolnay/rust-toolchain@3056ad9b1fc916cb9a55f7f72ae4a848b7d50249 # 1.91.0
      # Must be a separate step, not the action's `targets:` input. The action
      # installs "1.91.0" while rust-toolchain.toml pins "1.91", and rustup
      # treats those as distinct toolchains -- so `targets:` lands on one and
      # cargo resolves the other. Running rustup inside the repo resolves the
      # toolchain file, adding the target where cargo will actually look.
      # publish.yml only avoids this because its targets are the host triple,
      # which every toolchain ships by default.
      - name: Add iOS target to the toolchain cargo will use
        run: rustup target add aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios-build
      # The app is a staticlib on iOS, so --lib is the whole compile surface
      # that matters here. This is what guards against a dependency landing in
      # the tree that cannot cross-compile to aarch64-apple-ios.
      - name: Build Rust for aarch64-apple-ios
        run: cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib
        timeout-minutes: 45
