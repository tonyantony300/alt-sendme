name: Cargo Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    # Soft-fail until engine/wasm-bridge lockfiles catch up with known RustSec
    # fixes already present in src-tauri. Keep the check visible without
    # blocking this hygiene PR; flip to hard-fail after a dedicated bump PR.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - engine
          - src-tauri
          - wasm-bridge

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit --file "${{ matrix.workspace }}/Cargo.lock"
