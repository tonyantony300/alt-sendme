name: Flatpak lint

# Lints the Flathub packaging (manifest + metainfo) on PRs, no full build.
# Report-only: findings go to the run summary and the job stays green. Two are
# expected until we submit and deploy (--filesystem=home, and screenshot URLs
# that aren't live yet). To enforce later, fail on the linter exit code and add
# an --exceptions file for those two.

on:
  push:
    branches:
      - main
    paths:
      - 'flatpak/**'
  pull_request:
    branches:
      - main
    paths:
      - 'flatpak/**'
  workflow_dispatch:

jobs:
  flatpak-lint:
    name: Flatpak manifest + appstream lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint manifest and metainfo
        run: |
          img=ghcr.io/flathub-infra/flatpak-builder-lint:latest
          {
            echo '### Manifest'
            echo '```'
            docker run --rm -v "$PWD":/w -w /w "$img" manifest flatpak/net.dashbeam.DashBeam.yml 2>&1 || true
            echo '```'
            echo '### AppStream metainfo'
            echo '```'
            docker run --rm -v "$PWD":/w -w /w "$img" appstream flatpak/net.dashbeam.DashBeam.metainfo.xml 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
