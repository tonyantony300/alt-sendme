name: Flatpak lint

# Lints the Flathub packaging (manifest + metainfo) on PRs, no full build.
# Report-only: findings go to the run summary and the job stays green. The
# screenshot warnings clear once the site deploys; drop the `|| true` after
# that to make this blocking.

on:
  push:
    branches:
      - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-lint:
    name: Flatpak manifest + appstream lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint manifest and metainfo
        run: |
          set -euo pipefail
          img=ghcr.io/flathub-infra/flatpak-builder-lint:latest
          # Fail if the linter can't run; lint findings stay report-only below.
          docker pull -q "$img"
          test -f flatpak/net.dashbeam.DashBeam.yml
          test -f flatpak/net.dashbeam.DashBeam.metainfo.xml
          {
            echo '### Manifest'
            echo '```'
            docker run --rm -v "$PWD":/w:ro -w /w "$img" manifest flatpak/net.dashbeam.DashBeam.yml 2>&1 || true
            echo '```'
            echo '### AppStream metainfo'
            echo '```'
            docker run --rm -v "$PWD":/w:ro -w /w "$img" appstream flatpak/net.dashbeam.DashBeam.metainfo.xml 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
