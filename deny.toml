# cargo-deny config for DashBeam (AGPL-3.0-only).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained transitive crates (common in Tauri) are noisy.
# RustSec vulns are gated by the cargo-audit workflow (soft-fail until
# lockfiles catch up). Deny CI only runs bans/licenses/sources.
unmaintained = "none"
unsound = "all"
ignore = [
    # Add ignored RustSec IDs here with a reason when needed, e.g.:
    # { id = "RUSTSEC-0000-0000", reason = "..." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
