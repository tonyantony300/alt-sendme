id: com.altsendme.AltSendme
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: altsendme

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Transfer app: users send/receive to arbitrary paths, and drag-and-drop can
  # hand the app raw host paths the file portal wouldn't cover.
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/altsendme/cargo

modules:
  - name: altsendme
    buildsystem: simple
    sources:
      # The vendored cargo/node sources below MUST be regenerated from this exact
      # tag's Cargo.lock / pnpm-lock.yaml (see flatpak/build-sources.sh), or the
      # offline build resolves against mismatched dependencies.
      - type: git
        url: https://github.com/tonyantony300/alt-sendme.git
        tag: v0.4.2
      - cargo-sources.json
      - node-sources.json
      # node22 SDK ships node + npm but not pnpm, and corepack needs network.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.12.1.tgz
        sha256: 889bac470ec93ccc3764488a19d6ba8f9c648ad5e50a9a6e4be3768a5de387a3
        dest: flatpak-node/pnpm
    build-options:
      env:
        VITE_IS_FLATPAK: 'true'
    build-commands:
      # BLOCKER: `pnpm run build` (tsc + vite) requires frontend/src/wasm/pkg,
      # which is web-only, gitignored, and absent from the source tag. Building it
      # here needs the wasm32 std + wasm-bindgen offline (not yet solved). The
      # clean fix is to stop the desktop build from bundling the web-only bridge.
      - ./scripts/build-wasm-bridge.sh --release
      # Install from the vendored pnpm store (node-sources.json set store-dir in .npmrc).
      - node flatpak-node/pnpm/bin/pnpm.cjs install --offline --frozen-lockfile
      - node flatpak-node/pnpm/bin/pnpm.cjs run build
      - node flatpak-node/pnpm/bin/pnpm.cjs exec tauri build --no-bundle -c src-tauri/tauri.linux-flatpak.conf.json
      - install -Dm755 src-tauri/target/release/alt-sendme /app/bin/altsendme
      - install -Dm644 flatpak/com.altsendme.AltSendme.desktop /app/share/applications/com.altsendme.AltSendme.desktop
      - install -Dm644 flatpak/com.altsendme.AltSendme.metainfo.xml /app/share/metainfo/com.altsendme.AltSendme.metainfo.xml
      - install -Dm644 flatpak/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.altsendme.AltSendme.png
      - install -Dm644 flatpak/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.altsendme.AltSendme.png
