id: com.altsendme.AltSendme
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: altsendme

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # See: https://docs.flathub.org/linter#finish-args-home-filesystem-access
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/altsendme/cargo

modules:
  - name: altsendme
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/tonyantony300/alt-sendme.git
        # Bump both to the release tag cut after this PR merges. v0.5.0 predates
        # the flatpak/ dir and the wasm decoupling, so the build fails against it.
        tag: v0.5.0
        commit: 36a6c66eabb0baca1595f0a3c319f044f73fcd33
      - cargo-sources.json
      - node-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.12.1.tgz
        sha256: 889bac470ec93ccc3764488a19d6ba8f9c648ad5e50a9a6e4be3768a5de387a3
        dest: flatpak-node/pnpm
        strip-components: 1
    build-options:
      env:
        VITE_IS_FLATPAK: 'true'
    build-commands:
      - node flatpak-node/pnpm/bin/pnpm.cjs install --offline --frozen-lockfile
      - node flatpak-node/pnpm/bin/pnpm.cjs run build
      - node flatpak-node/pnpm/bin/pnpm.cjs exec tauri build --no-bundle -c src-tauri/tauri.linux-flatpak.conf.json
      - install -Dm755 src-tauri/target/release/alt-sendme /app/bin/altsendme
      - install -Dm644 flatpak/com.altsendme.AltSendme.desktop /app/share/applications/com.altsendme.AltSendme.desktop
      - install -Dm644 flatpak/com.altsendme.AltSendme.metainfo.xml /app/share/metainfo/com.altsendme.AltSendme.metainfo.xml
      - install -Dm644 flatpak/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.altsendme.AltSendme.png
      - install -Dm644 flatpak/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.altsendme.AltSendme.png
