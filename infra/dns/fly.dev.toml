# Quick-test iroh-dns-server on Fly.io - NO custom domain.
#
# Fly's edge terminates TLS at https://<app>.fly.dev with a valid cert and
# proxies to the plain HTTP listener inside the container. That gives you a
# working HTTPS pkarr endpoint without owning a domain or provisioning certs.
#
# Deploy:
#   cd infra/dns
#   cp config.toml.example config.toml
#   # In config.toml for this dev path:
#   #   - set   [http] port = 8080
#   #   - comment out the entire [https] block (Fly's edge does TLS instead)
#   fly apps create --generate-name       # let Fly pick a random unique name...
#   # ...or:  fly apps create my-discovery # ...or choose your own unique name
#   # then set `app` below to that name, and:
#   fly deploy --config fly.dev.toml
#
# Discovery (pkarr) URL for DashBeam = https://<app>.fly.dev/pkarr

app = "your-unique-discovery-name"   # must be globally unique - replace before deploying
primary_region = "iad"               # pick a region near you (e.g. ams, sin, sjc)

# Build from the Dockerfile so config.toml is baked into the image.
[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "discovery_data"
  destination = "/data"

# The container serves plain HTTP on 8080 (see config.toml edits above) and
# Fly's edge provides TLS at https://<app>.fly.dev.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthcheck"
